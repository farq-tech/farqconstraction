# Codemagic CI — builds the فرق بناء iPhone app (mobile/) and ships it to TestFlight.
# The web app is not built or deployed here; Vercel keeps doing that.
#
# One-time setup in Codemagic:
#   Team settings → Integrations → Developer Portal → add an App Store Connect
#   API key and name it exactly: farq_asc
workflows:
  ios-testflight:
    name: فرق بناء — iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: farq_asc
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: sa.farq.construction
      vars:
        XCODE_PROJECT: mobile/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - src/mobile
          - src/components
          - src/api
          - src/lib
          - mobile
          - mobile.html
          - vite.mobile.config.ts
          - codemagic.yaml
    scripts:
      - name: Install web dependencies
        script: npm install --no-audit --no-fund
      - name: Install Capacitor dependencies
        script: npm ci --prefix mobile
      - name: Build the iPhone screens and sync them into Xcode
        script: npm run build --prefix mobile
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd mobile/ios/App
          agvtool new-version -all $((BUILD_NUMBER + 100))
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
